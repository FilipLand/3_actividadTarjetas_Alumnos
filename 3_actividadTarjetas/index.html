<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 9 tareas</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Mis 9 tareas</h1>
        <p>Organiza tus tareas y comprueba tu progreso.</p>
    </header>

    <main>
        <section class="resumen">
            <p id="contador">Tareas completadas: 0 de 9</p>
        </section>

        <section class="controles">
            <button id="btn-filtro">
                Ocultar tareas complejas
            </button>
        </section>

        <section id="lista-tareas" class="lista-tareas">
            <!-- JavaScript mostrará aquí las nueve tareas -->
        </section>
    </main>

    <footer>
        <p>Practicando JavaScript paso a paso</p>
    </footer>

</body>
</html>
